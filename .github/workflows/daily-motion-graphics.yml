name: Daily Motion Graphics

on:
  schedule:
    # 07:00, 12:00, 17:00, 21:00 WIB (Asia/Jakarta = UTC+7)
    - cron: '0 0,5,10,14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ffmpeg and Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg chromium-browser fonts-liberation

      - name: Install animation kit dependencies
        run: |
          cd animation-kit/kit
          npm install --omit=dev --no-audit --no-fund
          npm install -g hyperframes@0.8.34

      - name: Render motion graphics video
        env:
          PRODUCER_EXPERIMENTAL_FAST_CAPTURE: 'false'
        run: |
          if command -v chromium-browser >/dev/null 2>&1; then
            export HYPERFRAMES_BROWSER_PATH="$(command -v chromium-browser)"
          elif command -v google-chrome >/dev/null 2>&1; then
            export HYPERFRAMES_BROWSER_PATH="$(command -v google-chrome)"
          fi
          python3 render_next.py

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: motion-graphics-${{ env.RELEASE_TAG }}
          path: |
            output/*.mp4
            output/*.sheet.jpg
            output/*.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ env.RELEASE_TAG }}" \
            "${{ env.MP4_PATH }}" "${{ env.TXT_PATH }}" \
            --title "${{ env.VIDEO_TITLE }}" \
            --notes-file "${{ env.TXT_PATH }}"
